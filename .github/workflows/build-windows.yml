name: Windows-Build

# Baut den Installer und die portable ZIP-Version auf einem Windows-Runner.
# - Push auf main / manueller Start: Dateien als Artefakt am Workflow-Lauf
# - Tag v*: zusätzlich als GitHub-Release (öffentlicher Download-Link)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Windows-Pakete bauen
        run: npm run dist:win
        env:
          # Noch kein Signaturzertifikat: Signieren überspringen
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Trinkwasser-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*.exe
            dist/*.zip
